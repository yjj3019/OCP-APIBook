name: Pull request checks
on: pull_request
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check catalog, publication and MCP
        run: |
          node tools/stamp.js
          git diff --exit-code -- index.html sw.js
          node --test tools/test-publication.js
          node --test tools/test-skill.js tools/test-skill-catalog.js
          node mcp/smoke.js
          node tools/test-build.js
          node tools/cons-audit.js --strict
      - name: Exercise the local HTML entry point
        run: |
          python -m pip install playwright==1.65.2
          python -m playwright install --with-deps chromium
          python tools/test-menu.py --channel chromium
          python tools/test-guide-regressions.py --channel chromium
          python tools/test-explorer-regressions.py --channel chromium
          python tools/test-topology-regressions.py --channel chromium
          python tools/test-simulator-targets.py --channel chromium
