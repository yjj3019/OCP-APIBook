<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenShift API 북</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 가운데 한 줄 컬럼. 검색창이 화면의 중심이고, 결과 목록 → 상세 화면 순으로 한 번에 하나만 보인다. */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#161b22; --sub:#5b6573; --line:#e3e6eb;
  --accent:#d92d20; --accent-soft:#fdecea; --mark:#fff0a6; --code-bg:#10151c; --code-ink:#e6eaf0;
  --ok:#1a7f4b; --warn:#b54708;
  --sans:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --mono:"JetBrains Mono",Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1217; --panel:#161b22; --ink:#e8ecf1; --sub:#98a3b1; --line:#262d37;
  --accent:#ff6b5e; --accent-soft:#2b1715; --mark:#5c4b00; --code-bg:#0a0d12; --code-ink:#e6eaf0; --ok:#4cc38a; --warn:#f0a35a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1217; --panel:#161b22; --ink:#e8ecf1; --sub:#98a3b1; --line:#262d37;
  --accent:#ff6b5e; --accent-soft:#2b1715; --mark:#5c4b00; --code-bg:#0a0d12; --code-ink:#e6eaf0; --ok:#4cc38a; --warn:#f0a35a; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 var(--sans);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 80px}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
.brand{font-weight:700;letter-spacing:-.01em;text-decoration:none}
.brand i{font-style:normal;color:var(--accent)}
.nav{display:flex;gap:4px}
.nav button{background:none;border:0;padding:6px 10px;border-radius:8px;color:var(--sub)}
.nav button:hover,.nav button[aria-pressed="true"]{background:var(--panel);color:var(--ink)}

.hero{padding:6vh 0 18px;text-align:center}
.hero h1{font-size:clamp(24px,5vw,32px);line-height:1.25;margin:0 0 20px;letter-spacing:-.02em;text-wrap:balance}
.compact .hero{padding:8px 0 14px;text-align:left}
.compact .hero h1{display:none}

.search{position:relative}
.search input{width:100%;font:inherit;font-size:17px;padding:15px 44px 15px 18px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.search input::placeholder{color:var(--sub)}
.search input::-webkit-search-cancel-button{display:none}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search .x{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--sub);font-size:20px;line-height:1;padding:6px 8px;display:none}
.search.has .x{display:block}

.examples{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;justify-content:center}
.compact .examples{display:none}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 13px;font-size:13.5px;color:var(--sub)}
.chip:hover{color:var(--ink);border-color:var(--sub)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.cats{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;margin-top:6px;scrollbar-width:thin}
.cats .chip{white-space:nowrap;flex:none;font-size:13px;padding:3px 11px}
.hint{margin:10px 0 0;font-size:13px;color:var(--sub)}
.hint button{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline}

.count{color:var(--sub);font-size:13px;margin:14px 2px 6px}
.list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.row{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 16px}
.row:hover,.row.cur{border-color:var(--accent)}
.row.cur{box-shadow:0 0 0 3px var(--accent-soft)}
.row .l1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.kind{font:600 16px var(--mono);letter-spacing:-.02em;word-break:break-all}
.gv{font:12.5px var(--mono);color:var(--sub);word-break:break-all}
.tag{font-size:11.5px;color:var(--sub);border:1px solid var(--line);border-radius:6px;padding:0 6px;white-space:nowrap}
.row .snip{margin:4px 0 0;color:var(--sub);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .snip em{font-style:normal;font-size:11.5px;color:var(--accent);margin-right:6px}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.sec-title{font-size:13px;color:var(--sub);margin:22px 2px 6px;font-weight:500}
.empty{text-align:center;color:var(--sub);padding:40px 0}
.empty b{color:var(--ink)}

.back{background:none;border:0;color:var(--sub);padding:6px 0;margin-bottom:4px}
.back:hover{color:var(--ink)}
.d-title{font:700 clamp(22px,5vw,28px) var(--mono);letter-spacing:-.03em;margin:4px 0 8px;word-break:break-all}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--sub);font-size:13px}
.lead{font-size:16px;margin:16px 0 4px}
.more{background:none;border:0;padding:0;color:var(--accent);font-size:13.5px}
.full{white-space:pre-line;color:var(--sub);font-size:14px;margin:8px 0 0}
h3{font-size:15px;margin:30px 0 10px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;color:var(--sub);margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent);font-weight:500}
pre{position:relative;margin:0;background:var(--code-bg);color:var(--code-ink);padding:16px;border-radius:0 0 12px 12px;overflow-x:auto;font:13px/1.6 var(--mono)}
.tabs + pre{border-radius:0 0 12px 12px}
.copy{position:absolute;right:8px;top:8px;border:1px solid #3a4452;background:#1b222c;color:#c9d1db;border-radius:7px;font-size:12px;padding:2px 10px}
.note{font-size:13px;color:var(--sub);margin:8px 0 0}
details{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-top:10px}
summary{cursor:pointer;padding:12px 16px;font-weight:500;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--sub);font-size:18px}
details[open] summary::after{content:"–"}
details .in{padding:0 16px 14px}
.fscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:7px 10px 7px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--sub);font-weight:500}
td.n{font-family:var(--mono);white-space:nowrap;padding-right:16px}
td.t{font-family:var(--mono);color:var(--sub);white-space:nowrap;padding-right:16px;font-size:12.5px}
.req{color:var(--accent);font-weight:700}
.ff{width:100%;font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin:4px 0 8px}
.ep{padding:7px 0;border-bottom:1px solid var(--line);font:12.5px var(--mono);word-break:break-all}
.ep .ms{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.m{font:600 11px var(--mono);padding:1px 7px;border-radius:5px;border:1px solid var(--line);color:var(--sub)}
.m.GET{color:var(--ok)}.m.DELETE{color:var(--accent)}.m.POST,.m.PUT,.m.PATCH{color:var(--warn)}
.rel{display:flex;flex-wrap:wrap;gap:8px}
.rel .chip{font-family:var(--mono);font-size:12.5px}
.ext{display:inline-block;margin-top:22px;font-size:13.5px;color:var(--sub)}
.guide{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 20px 20px;margin-top:10px;overflow-x:auto}
.guide h2,.guide h3,.guide h4{font-size:16px;margin:22px 0 8px}
.guide pre{border-radius:10px;margin:10px 0}
.guide table{display:block;overflow-x:auto}
.guide img{max-width:100%}
.kbd{font:11.5px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--sub)}
/* 토폴로지 / 연결 관계 */
.wrap.wide{max-width:1240px}
.topomode .hero{display:none}
.tctl{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin:6px 0 8px}
.tchips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.tchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 11px}
.tchip svg{color:var(--sub)}
.tchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tchip[aria-pressed="true"] svg{color:var(--bg)}
.tchips.cats{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.cats .chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:2px 10px;white-space:nowrap;flex:none}
.cats .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.tfind{flex:1;min-width:200px;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink)}
.tfind:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.chk{font-size:13px;color:var(--sub);display:inline-flex;gap:6px;align-items:center}
.btn{font:inherit;font-size:13.5px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:9px;padding:6px 14px}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--sub)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{background:var(--panel);border:0;padding:4px 12px;font-size:13px;color:var(--sub)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.egobox{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px;align-items:start}
.tbody{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;align-items:start}
.gcv{position:relative;height:380px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.gcv.big{height:min(72vh,720px);min-height:420px}
.gcv canvas{display:block}
.zbtn{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.zbtn button{width:30px;height:30px;border:1px solid var(--line);background:var(--panel);border-radius:8px;font-size:16px;line-height:1;color:var(--ink)}
.gstat{position:absolute;left:12px;bottom:8px;font-size:12px;color:var(--sub);pointer-events:none}
.gtip{position:absolute;width:260px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:12.5px;line-height:1.5;box-shadow:0 6px 20px rgba(0,0,0,.18);pointer-events:none;z-index:3}
.gtip b{font:600 13px var(--mono)}.gtip span{font:11.5px var(--mono);color:var(--sub)}.gtip div{color:var(--sub);margin-top:2px}
.tinfo{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14px;max-height:min(72vh,720px);overflow:auto;min-width:0}
.ihelp p{color:var(--sub);margin:6px 0}
.ihead{display:flex;gap:10px;align-items:center}
.idot{width:14px;height:14px;border-radius:50%;flex:none}
.ikind{font:700 18px var(--mono);letter-spacing:-.02em;word-break:break-all}
.igv{font:12px var(--mono);color:var(--sub);word-break:break-all}
.imeta{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
.idesc{margin:10px 0 4px}
.imore summary{padding:0;font-weight:400;color:var(--accent);font-size:13px;display:block}
.imore summary::after{content:""}
.imore{border:0;background:none;margin:0}
.ifull{white-space:pre-line;color:var(--sub);font-size:13px;margin-top:6px}
.isum{background:var(--bg);border-radius:8px;padding:8px 10px;font-size:13px;margin:10px 0}
.rs{margin-top:12px}.rt{font-size:12.5px;color:var(--sub);margin-bottom:4px}.rt span{color:var(--ink)}
.rl2{display:flex;flex-direction:column;gap:4px}
.ri{display:flex;align-items:center;gap:8px;text-align:left;background:var(--bg);border:1px solid transparent;border-radius:8px;padding:5px 9px}
.ri:hover{border-color:var(--accent)}
.rk{font:600 13px var(--mono)}.rl{font-size:12.5px;color:var(--sub);flex:1;min-width:0}
.rb{font-size:11px;border-radius:5px;padding:0 6px;border:1px solid var(--line);color:var(--sub);margin-left:auto;flex:none}
.rb.mention{color:var(--ink)}
.iact{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
@media(max-width:860px){.egobox,.tbody{grid-template-columns:minmax(0,1fr)}.gcv{height:320px}.gcv.big{height:62vh}.tinfo{max-height:none}}
/* 버전 · 필드 트리 · 엔드포인트 · 비교 */
.vsel{font:inherit;font-size:13.5px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.nav{align-items:center;flex-wrap:wrap;justify-content:flex-end}
.tag.warn{color:var(--warn);border-color:var(--warn)}
.vrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 0}
.vchip{font:12.5px var(--mono);border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:1px 11px;text-decoration:none;color:var(--sub)}
.vchip:hover{border-color:var(--sub);color:var(--ink)}
.vchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.vchip.off{opacity:.55;border-style:dashed}
.loading{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13px;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.ftree{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 12px;max-height:560px;overflow:auto}
.fr{border-bottom:1px solid var(--line);padding:6px 0}
.fr:last-child{border-bottom:0}
.fr .fr{border-bottom:0;padding:4px 0}
.fc{margin-left:16px;border-left:2px solid var(--line);padding-left:10px}
.fh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.fh.has{cursor:pointer}
.fh.has:hover .fn{color:var(--accent)}
.tg{width:12px;color:var(--sub);flex:none;font-size:12px}
.fn{font:600 13.5px var(--mono);word-break:break-all}
.ftp{font:12px var(--mono);color:var(--sub)}
.fdsc{margin:1px 0 0 20px;font-size:13px;color:var(--sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.fdsc.open{-webkit-line-clamp:unset;white-space:pre-line}
.fr.flat .fdsc{margin-left:0}
.epd summary{gap:10px;justify-content:flex-start}
.epd summary::after{margin-left:auto}
.epd summary code{font:12.5px var(--mono);word-break:break-all}
.epd .ms{display:flex;gap:4px;flex:none}
.mb{border-top:1px solid var(--line);padding:10px 0}
.mb:first-child{border-top:0}
.mh{font-weight:500}
.mq{font-size:13px;color:var(--sub);margin:5px 0 0 0}
.mq b{color:var(--ink);font-weight:500;margin-right:6px}
.mq>div{margin:2px 0}
.resp{display:inline-block;margin:2px 10px 2px 0;font-size:12.5px}
.resp code,.mq code{font:12px var(--mono)}
.dl>div{padding:3px 0;font-size:13px}
.dp,.dm,.dc{display:inline-block;width:16px;font:700 13px var(--mono)}
.dp{color:var(--ok)}.dm{color:var(--accent)}.dc{color:var(--warn)}
.guide aside.alert{border-left:4px solid var(--sub);background:var(--bg);padding:8px 14px;border-radius:6px;margin:12px 0}
.guide aside.alert.important,.guide aside.alert.warning,.guide aside.alert.caution{border-color:var(--accent)}
.guide aside.alert.note,.guide aside.alert.tip{border-color:#2f6fed}
.guide aside.alert strong{display:block;margin-bottom:2px}
.guide aside.alert p{margin:4px 0}
[hidden]{display:none!important}
</style>

<body>
<div class="wrap" id="app">
  <div class="top">
    <a class="brand" href="#" id="home"><i>●</i> OpenShift API 북 <span id="brandv" style="color:var(--sub);font-weight:400"></span></a>
    <div class="nav"><select id="ver" class="vsel" aria-label="OpenShift 버전"></select><button id="nTopo" aria-pressed="false">토폴로지</button><button id="nCmp" aria-pressed="false">버전 비교</button><button id="nSim" aria-pressed="false">시뮬레이터</button><button id="nGuide" aria-pressed="false">가이드</button></div>
  </div>

  <div class="hero">
    <h1>찾는 API를 입력하세요</h1>
    <div class="search" id="sbox">
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="예: route, 네트워크 정책, mcp, pvc" aria-label="API 검색">
      <button class="x" id="clear" aria-label="지우기">×</button>
    </div>
    <div class="examples" id="examples"></div>
  </div>

  <div id="main"></div>
</div>

<div id="loading" class="loading" hidden></div>
<script src="data/versions.js"></script>
<script src="search.js"></script>
<script src="graph.js"></script>
<script src="viz.js"></script>
<script src="topo.js"></script>
<script src="sim.js"></script>
<script>
const VER = window.VERSIONS;
const DB = window.DB = window.DB || {};
const CAT = ApiSearch.CAT_KO;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hlz = (s, H) => esc(H(s)).replace(/\u0001/g, '<mark>').replace(/\u0002/g, '</mark>');
const KEY = a => a.kind + '|' + a.group;
const short = (t, n) => { t = String(t || '').replace(/\s+/g, ' ').trim(); n = n || 170; return t.length > n ? t.slice(0, n) + '…' : t; };
const firstSent = t => { t = String(t || '').replace(/\s+/g, ' ').trim(); return t.split(/(?<=[.!?])\s+(?=[A-Z])/)[0] || t; };

/* ---------- 버전별 데이터 로딩 ---------- */
let ver = null, E = null, G = null, GUIDE = [], cat = '', cur = -1, shown = [], live = null, routeSeq = 0;
const ENG = {};
const ls = src => new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error(src + ' 로드 실패')); document.head.appendChild(s); });
const loadCore = v => DB[v] ? Promise.resolve() : Promise.all([ls(`data/${v}.js`), ls(`data/${v}.fidx.js`)]);
const loadFields = v => (window.FIELDS && FIELDS[v]) ? Promise.resolve() : ls(`data/${v}.fields.js`);
const getFields = async v => { await loadFields(v); return FIELDS[v]; };
const stored = () => { try { return localStorage.getItem('apibook.ver'); } catch (e) { return null; } };
const store = v => { try { localStorage.setItem('apibook.ver', v); } catch (e) {} };
function prep(v) {
  const db = DB[v]; if (db._ok) return db;
  const fi = (window.FIDX && FIDX[v]) || {};
  db.apis.forEach(a => { a.fp = fi[a.id] || []; if (a.d) a.d.eps.forEach(e => { e.m = e.ms.map(x => x.m + ': ' + x.d); }); });
  db._ok = true; return db;
}
async function engines(v) {
  if (!ENG[v]) { await loadCore(v); const db = prep(v), b = { guide: db.guide, apis: db.apis }; ENG[v] = { E: ApiSearch.create(b), G: ApiGraph.create(b), db }; }
  return ENG[v];
}
const loading = (on, msg) => { const l = $('#loading'); l.hidden = !on; if (msg) l.textContent = msg; };
const ctxFor = () => ({ E, G, CAT, esc, ver, VER, db: DB[ver], go: nav, hash: h => '#' + ver + '/' + h, getFields: () => getFields(ver), docOf, short, firstSent });
async function useVersion(v) {

/* ---------- YAML / oc / REST 예시 ---------- */
const PRIM = /^(string|integer|number|boolean)/i;
function placeholder(t, name) {
  t = (t || '').toLowerCase();
  if (t.startsWith('string')) return `"<${name}>"`;
  if (/^(integer|number)/.test(t)) return '0';
  if (t.startsWith('boolean')) return 'false';
  if (t.startsWith('array')) return '[]';
  if (/^(time|microtime)$/.test(t)) return '"2025-01-01T00:00:00Z"';
  if (/^(duration|quantity|intorstring)$/.test(t)) return '"<' + name + '>"';
  return '{}';
}
function yamlFull(d, F) {
  const a = d.a, byPath = F ? new Map(F.map(f => [f.p, f])) : new Map();
  const rowsOf = p => p === '' ? a.d.props.map(x => [x.n, x.t]) : (byPath.get(p) ? byPath.get(p).r : []);
  const reqOf = p => p === '' ? a.d.required : (byPath.get(p) ? byPath.get(p).q : []);
  function obj(path, ind, depth) {
    const out = [], rows = rowsOf(path), pad = ' '.repeat(ind);
    for (const name of reqOf(path)) {
      if (path === '' && ['apiVersion', 'kind', 'metadata'].includes(name)) continue;
      const row = rows.find(r => r[0] === name), t = row ? row[1] : '';
      const cp = path + '.' + name;
      if (/^array/i.test(t) && !PRIM.test(t.replace(/^array\s*\(?/i, ''))) {
        const ip = cp + '[]', item = depth < 6 && byPath.has(ip) ? obj(ip, ind + 4, depth + 1) : [];
        if (item.length) { item[0] = ' '.repeat(ind + 2) + '- ' + item[0].trimStart(); out.push(pad + name + ':', ...item); }
        else out.push(pad + name + ': []');
      } else if (/^object$/i.test(t) || (byPath.has(cp) && !PRIM.test(t))) {
        const sub = depth < 6 ? obj(cp, ind + 2, depth + 1) : [];
        if (sub.length) out.push(pad + name + ':', ...sub); else out.push(pad + name + ': {}');
      } else out.push(pad + name + ': ' + placeholder(t, name));
    }
    return out;
  }
  const head = [`apiVersion: ${d.gv}`, `kind: ${a.kind}`, 'metadata:', '  name: <이름>'];
  if (d.ns) head.push('  namespace: <네임스페이스>');
  const body = obj('', 0, 0);
  if (!body.length && a.d.props.some(p => p.n === 'spec')) body.push('spec: {}   # 필드는 아래 \'필드\' 참고');
  return head.concat(body).join('\n');
}
function ocFor(d) {
  const a = d.a, r = a.group ? `${d.low}.${a.group}` : d.low, n = d.ns ? ' -n <네임스페이스>' : '';
  return `# 목록 보기
oc get ${r}${d.ns ? ' -A' : ''}

# 하나 자세히 보기
oc get ${r} <이름>${n} -o yaml

# 필드 설명 보기
oc explain ${r}
oc explain ${r}.spec

# 서버에 적용하기 전 검증만 (저장 안 함)
oc apply --dry-run=server -f ${d.low}.yaml

# 만들기·수정 (위 YAML을 ${d.low}.yaml 로 저장)
oc apply -f ${d.low}.yaml

# 편집 · 삭제
oc edit ${r} <이름>${n}
oc delete ${r} <이름>${n}`;
}
function restFor(d) {
  const eps = (d.a.d && d.a.d.eps) || [], fill = p => p.replace('{namespace}', '<네임스페이스>').replace('{name}', '<이름>');
  const has = (e, m) => e.ms.some(x => x.m === m);
  const col = eps.find(e => !/\{name\}|watch/.test(e.p) && has(e, 'GET')), one = eps.find(e => /\{name\}$/.test(e.p) && has(e, 'GET'));
  if (!col && !one) return '# 이 API는 REST 예시를 만들 수 없습니다. 아래 엔드포인트를 참고하세요.';
  const H = '-H "Authorization: Bearer $TOKEN"';
  let s = `TOKEN=$(oc whoami -t)\nAPISERVER=$(oc whoami --show-server)\n`;
  if (col) s += `\n# 목록 조회\ncurl -sk ${H} "$APISERVER${fill(col.p)}"`;
  if (one) s += `\n\n# 하나 조회\ncurl -sk ${H} "$APISERVER${fill(one.p)}"`;
  if (col && has(col, 'POST')) s += `\n\n# 생성 (본문은 위 YAML 파일)\ncurl -sk -X POST ${H} -H "Content-Type: application/yaml" --data-binary @${d.low}.yaml \\\n  "$APISERVER${fill(col.p)}?fieldValidation=Strict"`;
  if (one && has(one, 'PATCH')) s += `\n\n# 일부만 수정 (merge patch)\ncurl -sk -X PATCH ${H} -H "Content-Type: application/merge-patch+json" \\\n  -d '{"metadata":{"labels":{"app":"demo"}}}' "$APISERVER${fill(one.p)}"`;
  if (one && has(one, 'DELETE')) s += `\n\n# 삭제\ncurl -sk -X DELETE ${H} "$APISERVER${fill(one.p)}"`;
  return s;
}

function fieldTree(host, a, F) {
  const byPath = new Map(F.map(f => [f.p, f]));
  const topRows = a.d.props.map(p => [p.n, p.t, p.d]);
  const rows = p => p === '' ? topRows : (byPath.get(p) ? byPath.get(p).r : []);
  const reqs = p => new Set(p === '' ? a.d.required : (byPath.get(p) ? byPath.get(p).q : []));
  const base = n => n.replace(/(\[\]|\{\})+$/, '');
  const childOf = (p, n) => { for (const suf of ['[]', '{}', '']) { const c = p + '.' + base(n) + suf; const f = byPath.get(c); if (f && f.r.length) return c; } return null; };
  const visible = (p, r) => !/(\[\]|\{\})$/.test(r[0]) || !rows(p).some(x => x[0] === base(r[0]));
  const rowHTML = (p, r) => {
    const c = childOf(p, r[0]);
    return `<div class="fr"><div class="fh${c ? ' has' : ''}"${c ? ` data-p="${esc(c)}"` : ''}><span class="tg">${c ? '▸' : '·'}</span><span class="fn">${esc(r[0])}</span><span class="ftp">${esc(r[1])}</span>${reqs(p).has(r[0]) ? '<span class="req">필수</span>' : ''}</div><div class="fdsc">${esc(r[2])}</div><div class="fc" hidden></div></div>`;
  };
  const list = p => rows(p).filter(r => visible(p, r)).map(r => rowHTML(p, r)).join('');
  const all = [];
  for (const p of [''].concat([...byPath.keys()])) rows(p).forEach(r => { if (!/(\[\]|\{\})$/.test(r[0])) all.push({ path: (p + '.' + r[0]).replace(/^\./, ''), t: r[1], d: r[2], req: reqs(p).has(r[0]) }); });
  const total = all.length;
  host.innerHTML = `<input class="ff" id="fq" placeholder="필드 검색 (예: tls, termination, port) — ${total}개 필드" aria-label="필드 검색"><div class="ftree" id="ft">${list('')}</div>`;
  const ft = host.querySelector('#ft'), fq = host.querySelector('#fq');
  const openSpec = ft.querySelector('.fh[data-p=".spec"]'); if (openSpec) toggle(openSpec);
  function toggle(h) {
    const box = h.parentElement.querySelector('.fc'), p = h.dataset.p;
    if (box.hidden) { if (!box.innerHTML) box.innerHTML = list(p); box.hidden = false; h.querySelector('.tg').textContent = '▾'; }
    else { box.hidden = true; h.querySelector('.tg').textContent = '▸'; }
  }
  ft.addEventListener('click', e => {
    const h = e.target.closest('.fh.has'); if (h) return toggle(h);
    const d = e.target.closest('.fdsc'); if (d) d.classList.toggle('open');
  });
  fq.addEventListener('input', () => {
    const w = fq.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    if (!w.length) { ft.innerHTML = list(''); const s = ft.querySelector('.fh[data-p=".spec"]'); if (s) toggle(s); return; }
    const hit = all.filter(f => { const hay = (f.path + ' ' + f.d).toLowerCase(); return w.every(x => hay.includes(x)); });
    const re = new RegExp('(' + w.map(x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
    ft.innerHTML = `<div class="count" style="margin:4px 0">${hit.length}개 일치${hit.length > 120 ? ' (상위 120개)' : ''}</div>` + hit.slice(0, 120).map(f => `<div class="fr flat"><div class="fh"><span class="fn">${esc(f.path).replace(re, '<mark>$1</mark>')}</span><span class="ftp">${esc(f.t)}</span>${f.req ? '<span class="req">필수</span>' : ''}</div><div class="fdsc">${esc(f.d).replace(re, '<mark>$1</mark>')}</div></div>`).join('');
  });
}

/* ---------- 버전 비교(한 API) ---------- */
async function apiMap(v, id) {
  await loadCore(v); const db = prep(v); await loadFields(v);
  const a = db.apis.find(x => x.id === id); if (!a || !a.d) return null;
  const m = new Map(); a.d.props.forEach(p => m.set(p.n, p.t));
  (FIELDS[v][id] || []).forEach(f => f.r.forEach(r => { if (!/(\[\]|\{\})$/.test(r[0])) m.set((f.p + '.' + r[0]).replace(/^\./, ''), r[1]); }));
  const eps = new Set(a.d.eps.map(e => e.p + ' ' + [...new Set(e.ms.map(x => x.m))].sort().join(',')));
  return { a, m, eps, req: new Set(a.d.required) };
}
async function renderDiff(host, a) {
  const key = KEY(a), info = VER.apis[key] || {}, others = VER.list.filter(v => v !== ver);
  host.innerHTML = `<div class="tctl"><label for="dv" class="note" style="margin:0">비교할 버전</label><select id="dv" class="vsel">${others.map(v => `<option value="${v}"${info[v] ? '' : ' disabled'}>${v}${info[v] ? '' : ' (이 API 없음)'}</option>`).join('')}</select></div><div id="dres" class="note">버전을 고르면 비교합니다.</div>`;
  const run = async () => {
    const ov = host.querySelector('#dv').value, out = host.querySelector('#dres'); if (!ov || !info[ov]) { out.textContent = '선택한 버전에는 이 API가 없습니다.'; return; }
    out.textContent = `${ov} 데이터 불러오는 중…`;
    try {
      const [c, o] = await Promise.all([apiMap(ver, a.id), apiMap(ov, info[ov].id)]);
      if (!c || !o) { out.textContent = '비교할 데이터가 없습니다.'; return; }
      const added = [...c.m.keys()].filter(k => !o.m.has(k)), removed = [...o.m.keys()].filter(k => !c.m.has(k));
      const changed = [...c.m.keys()].filter(k => o.m.has(k) && o.m.get(k) !== c.m.get(k));
      const epA = [...c.eps].filter(k => !o.eps.has(k)), epR = [...o.eps].filter(k => !c.eps.has(k));
      const reqA = [...c.req].filter(k => !o.req.has(k)), reqR = [...o.req].filter(k => !c.req.has(k));
      const descChanged = c.a.d.desc !== o.a.d.desc, vChanged = c.a.version !== o.a.version;
      const sec = (t, arr, fmt) => arr.length ? `<details class="epd"><summary>${t} <b>${arr.length}</b></summary><div class="in dl">${arr.slice(0, 300).map(fmt).join('')}${arr.length > 300 ? '<div class="note">상위 300개만 표시</div>' : ''}</div></details>` : '';
      const same = !added.length && !removed.length && !changed.length && !epA.length && !epR.length && !reqA.length && !reqR.length && !descChanged && !vChanged;
      out.innerHTML = `<p class="isum"><b>${ver}</b> 기준, <b>${ov}</b> 대비: 필드 +${added.length} / −${removed.length} / 타입변경 ${changed.length} · 엔드포인트 +${epA.length} / −${epR.length}${vChanged ? ` · API 버전 ${esc(o.a.version)} → ${esc(c.a.version)}` : ''}${descChanged ? ' · 설명 변경' : ''}${same ? ' · <b>차이 없음</b>' : ''}</p>` +
        sec('추가된 필드', added, k => `<div><span class="dp">+</span><code>${esc(k)}</code> <span class="ftp">${esc(c.m.get(k))}</span></div>`) +
        sec('삭제된 필드', removed, k => `<div><span class="dm">−</span><code>${esc(k)}</code> <span class="ftp">${esc(o.m.get(k))}</span></div>`) +
        sec('타입이 바뀐 필드', changed, k => `<div><span class="dc">~</span><code>${esc(k)}</code> <span class="ftp">${esc(o.m.get(k))} → ${esc(c.m.get(k))}</span></div>`) +
        sec('필수 필드 변경', reqA.map(k => ['+', k]).concat(reqR.map(k => ['−', k])), x => `<div><span class="${x[0] === '+' ? 'dp' : 'dm'}">${x[0]}</span><code>${esc(x[1])}</code> 필수</div>`) +
        sec('추가된 엔드포인트', epA, k => `<div><span class="dp">+</span><code>${esc(k)}</code></div>`) + sec('삭제된 엔드포인트', epR, k => `<div><span class="dm">−</span><code>${esc(k)}</code></div>`);
    } catch (e) { out.textContent = '비교 중 오류: ' + e.message; }
  };
  host.querySelector('#dv').addEventListener('change', run);
  const first = others.find(v => info[v]); if (first) { host.querySelector('#dv').value = first; run(); }
}

function copyText(t, btn){
  const done = () => { btn.textContent = '복사됨'; setTimeout(() => btn.textContent = '복사', 1200); };
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(done).catch(() => { const r = document.createRange(); r.selectNodeContents(btn.nextElementSibling); const s = getSelection(); s.removeAllRanges(); s.addRange(r); });
}

function showAPI(id){

  mode('detail'); setNav('');
  const sents = x && x.desc ? x.desc.replace(/Compatibility level.*$/s, '').trim() : '';
  const first = firstSent(sents), rest = sents.replace(/\s+/g, ' ').slice(first.length).trim();
  const rel = E.docs.filter(o => o !== d && a.group && o.a.group === a.group).slice(0, 12);
  const info = VER.apis[KEY(a)] || {}, mine = info[ver];
  const vchips = VER.list.map(v => info[v] ? `<a class="vchip${v === ver ? ' on' : ''}" href="#${v}/api:${esc(info[v].id)}" title="${mine && info[v].fp !== mine.fp ? '현재 버전과 필드·엔드포인트가 다릅니다' : '현재 버전과 같습니다'}">${v}${mine && info[v].fp !== mine.fp ? ' ●' : ''}</a>` : `<span class="vchip off">${v} 없음</span>`).join('');
  const tabs = [['YAML', x ? yamlFull(d, null) : ''], ['oc 명령', ocFor(d)], ['REST', restFor(d)]];
  const scope = d.ns ? '네임스페이스 범위' : (x && x.eps.length ? '클러스터 범위' : '');
  let h = `<button class="back" id="back">← 검색 결과로</button>
  <h2 class="d-title">${esc(a.kind)}</h2>
  <div class="meta"><span class="gv">${esc(d.gv)}</span>${scope ? `<span class="tag">${scope}</span>` : ''}<span class="tag">${CAT[a.book] || ''}</span></div>
  <div class="vrow"><span class="note" style="margin:0">제공 버전</span>${vchips}</div>
  <p class="lead">${esc(first)}</p>${rest ? `<button class="more" id="more">자세히 보기</button><div class="full" id="full" hidden>${esc(rest)}</div>` : ''}
  ${x && x.required.length ? `<p class="note">반드시 넣어야 하는 필드: ${x.required.map(r => `<code class="req">${esc(r)}</code>`).join(' ')}</p>` : ''}
  <div class="iact" style="margin:12px 0 0"><button class="btn" id="tosim">시뮬레이터에서 설계하기</button></div>
  <h3>사용해 보기</h3>
  <div class="tabs" role="tablist">${tabs.map((t,i) => `<button role="tab" data-tab="${i}" aria-selected="${i===0}">${t[0]}</button>`).join('')}</div>
  <pre id="code"><button class="copy" id="copy">복사</button><code></code></pre>
  <p class="note" id="ynote">필수 필드(하위 필드 포함)로 만든 기본 틀입니다. 값은 필드 설명과 공식 문서를 보고 채우세요.</p>
  <div id="ego"></div>`;
  if (x && x.props.length) h += `<h3>필드</h3><div id="fieldhost"><p class="note">필드 정보를 불러오는 중…</p></div>`;
  if (x && x.eps.length) h += `<h3>엔드포인트 ${x.eps.length}개</h3><div id="epshost">${epsHTML(a)}</div>`;
  h += `<h3>다른 버전과 비교</h3><div id="diffhost"><button class="btn ghost" id="diffgo">비교 보기</button></div>`;
  if (rel.length) h += `<h3>같은 그룹의 다른 API</h3><div class="rel">` + rel.map(o => `<button class="chip" data-api="${esc(o.a.id)}">${esc(o.a.kind)}</button>`).join('') + `</div>`;
  h += `<a class="ext" href="${esc(a.url)}" target="_blank" rel="noopener">공식 문서에서 전체 설명 보기 ↗</a>`;
  $('#main').innerHTML = h;
  live = Topo.mountEgo($('#ego'), id);

  let curTab = 0;
  const setTab = i => { curTab = i; document.querySelectorAll('.tabs button').forEach((b, j) => b.setAttribute('aria-selected', j === i)); $('#code code').textContent = tabs[i][1]; };
  setTab(0);
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => setTab(+b.dataset.tab));
  $('#copy').onclick = e => copyText($('#code code').textContent, e.target);
  const mb = $('#more'); if (mb) mb.onclick = () => { $('#full').hidden = !$('#full').hidden; mb.textContent = $('#full').hidden ? '자세히 보기' : '접기'; };
  $('#back').onclick = () => nav('');
  $('#tosim').onclick = () => nav('sim:' + id);
  $('#diffgo').onclick = () => renderDiff($('#diffhost'), a);
  // 중첩 필드는 큰 파일이라 뒤늦게 로드: 필드 트리와 YAML 예시를 보강
  const myId = id;
  getFields(ver).then(FA => {
    if (!$('#main') || !document.getElementById('code') || routeSeq && false) return;
    const F = FA[myId] || [];
    const fh = $('#fieldhost'); if (fh) fieldTree(fh, a, F);
    if (x) { tabs[0][1] = yamlFull(d, F); if (curTab === 0 && document.getElementById('code')) setTab(0); }
  }).catch(() => { const fh = $('#fieldhost'); if (fh) fh.innerHTML = '<p class="note">중첩 필드 데이터를 불러오지 못했습니다.</p>'; });
  window.scrollTo(0, 0);
}

/* ---------- 버전 비교(전체) ---------- */
function showCompare(h) {
  unmount(); mode('cmp'); setNav('cmp');
  const list = VER.list, to0 = ver, from0 = list[list.indexOf(ver) + 1] || list[list.indexOf(ver) - 1];
  $('#main').innerHTML = `<button class="back" id="back">← 처음으로</button><h2 class="d-title" style="font-family:var(--sans);font-size:22px">버전 비교</h2>
    <p class="note" style="margin:0 0 10px">두 버전 사이에서 API가 추가·삭제·변경된 내용을 봅니다. 변경은 필드·타입·엔드포인트가 달라진 경우입니다.</p>
    <div class="tctl"><label class="note" style="margin:0" for="cf">기준</label><select id="cf" class="vsel">${list.map(v => `<option${v === from0 ? ' selected' : ''}>${v}</option>`).join('')}</select><span class="note" style="margin:0">→</span><label class="note" style="margin:0" for="ct">대상</label><select id="ct" class="vsel">${list.map(v => `<option${v === to0 ? ' selected' : ''}>${v}</option>`).join('')}</select><input class="tfind" id="cq" placeholder="API 이름으로 거르기" style="max-width:260px"></div>
    <div id="cres"></div>`;
  $('#back').onclick = () => nav('');
  let tab = 'changed';
  const render = () => {
    const f = $('#cf').value, t = $('#ct').value, q = $('#cq').value.trim().toLowerCase(); if (f === t) { $('#cres').innerHTML = '<div class="empty">서로 다른 두 버전을 고르세요.</div>'; return; }
    const A = [], R = [], C = [], S = [];
    for (const [k, o] of Object.entries(VER.apis)) {
      const x = o[f], y = o[t], nm = k.split('|');
      const item = { kind: nm[0], group: nm[1], x, y };
      if (q && !nm[0].toLowerCase().includes(q)) continue;
      if (y && !x) A.push(item); else if (x && !y) R.push(item); else if (x && y) (x.fp === y.fp && x.v === y.v ? S : C).push(item);
    }
    const sets = { added: A, removed: R, changed: C, same: S };
    const li = (i, which) => { const target = which === 'removed' ? [f, i.x] : [t, i.y]; return `<li><a class="row" href="#${target[0]}/api:${esc(target[1].id)}"><div class="l1"><span class="kind">${esc(i.kind)}</span><span class="gv">${esc(i.group || 'core')}/${esc((i.y || i.x).v)}</span>${i.x && i.y && i.x.v !== i.y.v ? `<span class="tag">${esc(i.x.v)} → ${esc(i.y.v)}</span>` : ''}</div></a></li>`; };
    $('#cres').innerHTML = `<div class="tchips" style="margin:10px 0">${[['added', `추가 ${A.length}`], ['removed', `삭제 ${R.length}`], ['changed', `변경 ${C.length}`], ['same', `동일 ${S.length}`]].map(([k, l]) => `<button class="chip tchip" data-ctab="${k}" aria-pressed="${tab === k}">${l}</button>`).join('')}</div>
      <p class="note" style="margin:0 0 8px">${f} → ${t} · ${tab === 'added' ? `${t}에 새로 생긴 API` : tab === 'removed' ? `${f}에 있었으나 ${t}에는 없는 API` : tab === 'changed' ? '양쪽에 있지만 필드·엔드포인트·API 버전이 다른 API' : '양쪽에서 같은 API'}</p>
      <ul class="list">${sets[tab].slice(0, 400).map(i => li(i, tab)).join('') || '<li class="empty">해당하는 API가 없습니다.</li>'}</ul>`;
  };
  $('#cf').onchange = $('#ct').onchange = render; $('#cq').oninput = render;
  $('#cres').addEventListener('click', e => { const b = e.target.closest('[data-ctab]'); if (b) { tab = b.dataset.ctab; render(); } });
  render(); window.scrollTo(0, 0);
}

/* ---------- 가이드 ---------- */
function showGuideList(){
  unmount(); mode('detail'); setNav('guide');
  $('#main').innerHTML = `<button class="back" id="back">← 처음으로</button><h2 class="d-title" style="font-family:var(--sans)">가이드</h2><p class="note">API 지원 단계, 호환성 정책, kubelet 로그 설정 문서입니다(${ver}). 검색창에 입력해도 함께 찾아 줍니다.</p><ul class="list" style="margin-top:14px">` +
    GUIDE.filter(g => g.level <= 3 && !/^Overview|^API overview|^OpenShift Container/.test(g.title)).map(g => `<li><button class="row" data-guide="${esc(g.id)}" style="${g.level===3?'margin-left:18px;width:calc(100% - 18px)':''}"><span style="font-weight:${g.level===2?600:400}">${esc(g.title)}</span></button></li>`).join('') + `</ul>`;
  $('#back').onclick = () => nav('');
  window.scrollTo(0, 0);
}
function showGuide(id){
  const g = GUIDE.find(s => s.id === id); if (!g) return showGuideList();
  unmount(); mode('detail'); setNav('guide');
  $('#main').innerHTML = `<button class="back" id="back">← 가이드 목록</button><h2 class="d-title" style="font-family:var(--sans);font-size:22px">${esc(g.title)}</h2><div class="guide">${g.html}</div>`;
  document.querySelectorAll('.guide pre').forEach(p => { const b = document.createElement('button'); b.className = 'copy'; b.textContent = '복사'; b.onclick = e => copyText(p.innerText.replace(/^복사\n?/,''), e.target); p.prepend(b); });
  $('#back').onclick = () => nav('guide');
  window.scrollTo(0, 0);
}

/* ---------- 토폴로지 · 시뮬레이터 ---------- */
function showTopo(sel){
  unmount(); mode('topo'); setNav('topo');
  $('#main').innerHTML = `<button class="back" id="back">← 처음으로</button><h2 class="d-title" style="font-family:var(--sans);font-size:22px">토폴로지 <span class="gv">${ver}</span></h2>
    <p class="note" style="margin:0 0 8px">API 사이의 연결을 한눈에 봅니다. 색은 분류, 크기는 연결 수입니다. 노드를 누르면 설명과 연결 목록이 오른쪽에 나옵니다.</p><div id="topo"></div>`;
  $('#back').onclick = () => nav('');
  live = Topo.mountFull($('#topo'), G.byId.has(sel) ? sel : null);
  window.scrollTo(0, 0);
}
function showSim(id){
  unmount(); mode('sim'); setNav('sim');
  $('#main').innerHTML = `<button class="back" id="back">← 처음으로</button><div id="simhost"></div>`;
  $('#back').onclick = () => nav('');
  if (typeof Sim === 'undefined') { $('#simhost').innerHTML = '<div class="empty">시뮬레이터를 불러오지 못했습니다.</div>'; return; }
  live = Sim.mount($('#simhost'), ctxFor(), id || '');
  window.scrollTo(0, 0);
}

/* ---------- 라우팅 · 이벤트 ---------- */
async function route(){
  const seq = ++routeSeq, { v, h } = parseHash();
  const want = (v && VER.list.includes(v)) ? v : (ver || (VER.list.includes(stored()) ? stored() : VER.default));
  if (want !== ver) { try { await useVersion(want); } catch (e) { $('#main').innerHTML = `<div class="empty">데이터를 불러오지 못했습니다: ${esc(e.message)}</div>`; return; } if (seq !== routeSeq) return; }
  if (h.startsWith('api:')) return showAPI(h.slice(4));
  if (h.startsWith('guide:')) return showGuide(h.slice(6));
  if (h === 'guide') return showGuideList();
  if (h === 'topology' || h.startsWith('topology:')) return showTopo(h.slice(9));
  if (h === 'compare') return showCompare(h);
  if (h === 'sim' || h.startsWith('sim:')) return showSim(h.slice(4));
  unmount(); setNav('');
  renderResults();
  if ($('#q').value === '') mode(cat ? 'list' : 'home');
}
window.addEventListener('hashchange', route);
let inputRaf = 0;   // 빠르게 입력해도 프레임당 한 번만 검색·렌더
$('#q').addEventListener('input', () => {
  if (location.hash && parseHash().h) { history.replaceState(null, '', location.pathname + '#' + ver + '/'); unmount(); setNav(''); }
  cancelAnimationFrame(inputRaf); inputRaf = requestAnimationFrame(renderResults);
});
$('#q').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { if (!shown.length) return; e.preventDefault(); cur = (cur + (e.key === 'ArrowDown' ? 1 : -1) + shown.length) % shown.length; markCur(); }
  else if (e.key === 'Enter' && cur >= 0 && shown[cur]) { nav('api:' + shown[cur].d.a.id); }
  else if (e.key === 'Escape') { $('#q').value = ''; cat = ''; renderResults(); }
});
$('#clear').onclick = () => { $('#q').value = ''; $('#q').focus(); if (parseHash().h) nav(''); else renderResults(); };
$('#nGuide').onclick = () => nav(parseHash().h === 'guide' ? '' : 'guide');
$('#nTopo').onclick = () => nav(parseHash().h.startsWith('topology') ? '' : 'topology');
$('#nCmp').onclick = () => nav(parseHash().h === 'compare' ? '' : 'compare');
$('#nSim').onclick = () => nav(parseHash().h.startsWith('sim') ? '' : 'sim');
$('#home').onclick = e => { e.preventDefault(); $('#q').value = ''; cat = ''; if (parseHash().h) nav(''); else renderResults(); };
$('#ver').onchange = e => { const { h } = parseHash(); location.hash = e.target.value + '/' + h; };
document.addEventListener('click', e => {
  const t = e.target.closest('[data-q],[data-cat],[data-i],[data-guide],[data-api]'); if (!t) return;
  if (t.dataset.q !== undefined) { $('#q').value = t.dataset.q; if (parseHash().h) history.replaceState(null, '', location.pathname + '#' + ver + '/'); renderResults(); $('#q').focus(); }
  else if (t.dataset.cat !== undefined) { cat = t.dataset.cat; renderResults(); }
  else if (t.dataset.i !== undefined) { nav('api:' + shown[+t.dataset.i].d.a.id); }
  else if (t.dataset.guide) { nav('guide:' + t.dataset.guide); }
  else if (t.dataset.api) { nav('api:' + t.dataset.api); }
});
document.addEventListener('keydown', e => { if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); $('#q').focus(); } });
route();
</script>
</body>
